# ComEd Space-Time-of-Use rate structure for 2026 (BES supply).
# All prices are in cents/kWh—matches the pipeline's internal convention
# and avoids floating-point confusion between cents and dollars.
name: comed_stou_2026_rate_best_supply
timezone: America/Chicago
unit: cents_per_kwh
holiday_rule: treat_as_weekend

# Hour ranges are half-open [start_hour, end_hour) so adjacent periods
# tile without overlap.  Wrap-around (e.g. 21→6) is handled in code.
seasons:
  - name: summer
    start_mmdd: "06-01"
    end_mmdd: "09-30"
    periods:
      - period: morning
        start_hour: 6
        end_hour: 13
        price: 3.013
      - period: midday_peak
        start_hour: 13
        end_hour: 19
        price: 4.787
      - period: evening
        start_hour: 19
        end_hour: 21
        price: 3.090
      - period: overnight
        start_hour: 21
        end_hour: 6
        price: 1.870

  # Nonsummer wraps around the calendar year (Oct 1 → May 31).
  # _in_season() handles this wrap via day-of-year comparison.
  - name: nonsummer
    start_mmdd: "10-01"
    end_mmdd: "05-31"
    periods:
      - period: morning
        start_hour: 6
        end_hour: 13
        price: 2.829
      - period: midday_peak
        start_hour: 13
        end_hour: 19
        price: 3.383
      - period: evening
        start_hour: 19
        end_hour: 21
        price: 3.086
      - period: overnight
        start_hour: 21
        end_hour: 6
        price: 2.012
