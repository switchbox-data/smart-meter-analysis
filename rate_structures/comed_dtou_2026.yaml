# ComEd Dynamic Time-of-Use (DTOU) rate structure for 2026 — window definitions.
#
# IMPORTANT: Season boundaries and period hour windows MUST remain identical
# to those in comed_stou_2026.yaml.  Only the price values may differ between
# the two files.  The automated test
#   tests/test_rate_structure_window_alignment_real_yaml.py
# enforces this invariant.  If you shift any hour boundary or season date in
# one file you MUST make the same change in the other.
#
# TODO: Replace every price: 0.000 placeholder below with the actual DTOU
#       all-in supply+delivery cents/kWh values before running production
#       calendar builds.
#
# Price structure note:
#   DTOU delivery is TOU (same four windows as STOU).
#   DTOU supply is flat (uniform rate across all periods).
#   The price field here must be the ALL-IN (delivery TOU + flat supply)
#   cents/kWh so billing math is consistent with the STOU and flat-rate
#   calendars produced by scripts/build_tariff_hourly_prices.py.
#
name: comed_dtou_2026_rate
timezone: America/Chicago
unit: cents_per_kwh
holiday_rule: treat_as_weekend

# Hour ranges are half-open [start_hour, end_hour) — MUST match comed_stou_2026.yaml.
seasons:
  - name: summer
    start_mmdd: "06-01"
    end_mmdd: "09-30"
    periods:
      - period: morning
        start_hour: 6
        end_hour: 13
        price: 0.000  # TODO: actual DTOU summer morning cents/kWh
      - period: midday_peak
        start_hour: 13
        end_hour: 19
        price: 0.000  # TODO: actual DTOU summer midday_peak cents/kWh
      - period: evening
        start_hour: 19
        end_hour: 21
        price: 0.000  # TODO: actual DTOU summer evening cents/kWh
      - period: overnight
        start_hour: 21
        end_hour: 6
        price: 0.000  # TODO: actual DTOU summer overnight cents/kWh

  # Nonsummer wraps around the calendar year (Oct 1 → May 31) — same as STOU.
  - name: nonsummer
    start_mmdd: "10-01"
    end_mmdd: "05-31"
    periods:
      - period: morning
        start_hour: 6
        end_hour: 13
        price: 0.000  # TODO: actual DTOU nonsummer morning cents/kWh
      - period: midday_peak
        start_hour: 13
        end_hour: 19
        price: 0.000  # TODO: actual DTOU nonsummer midday_peak cents/kWh
      - period: evening
        start_hour: 19
        end_hour: 21
        price: 0.000  # TODO: actual DTOU nonsummer evening cents/kWh
      - period: overnight
        start_hour: 21
        end_hour: 6
        price: 0.000  # TODO: actual DTOU nonsummer overnight cents/kWh
